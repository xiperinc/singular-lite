<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>singular orchestration console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/assets/tokens.css">
  <link rel="stylesheet" href="/assets/styles.css">
  <link rel="stylesheet" href="/assets/plan.css">
  <link rel="stylesheet" href="/assets/consoles.css">
  <link rel="stylesheet" href="/assets/agents.css">
  <link rel="stylesheet" href="/assets/providers.css">
  <link rel="stylesheet" href="/assets/home.css">
</head>
<body>
  <!-- Custom geometric icon set — 16x16, 1.6px stroke, round caps, never filled -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-hub" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="8" cy="8" r="2.2"/><circle cx="8" cy="2.6" r="1.1"/><circle cx="3.2" cy="12" r="1.1"/><circle cx="12.8" cy="12" r="1.1"/>
        <line x1="8" y1="5.8" x2="8" y2="3.7"/><line x1="6.3" y1="9.4" x2="4.1" y2="11"/><line x1="9.7" y1="9.4" x2="11.9" y2="11"/>
      </symbol>
      <symbol id="i-layers" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 2.4 13.6 5.3 8 8.2 2.4 5.3Z"/><path d="M2.4 8.4 8 11.3 13.6 8.4"/>
      </symbol>
      <symbol id="i-box" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="10" height="10" rx="2.4"/>
      </symbol>
      <symbol id="i-branch" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="4.6" cy="4" r="1.5"/><circle cx="4.6" cy="12" r="1.5"/><circle cx="11.4" cy="5" r="1.5"/>
        <line x1="4.6" y1="5.5" x2="4.6" y2="10.5"/><path d="M11.4 6.5c0 3-2.6 3.6-4.4 4"/>
      </symbol>
      <symbol id="i-file" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 2.6h5l3 3v7.8H4Z"/><path d="M9 2.6v3h3"/>
      </symbol>
      <symbol id="i-shield" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 2.3 13 4v4c0 3.2-2.2 5-5 5.8C5.2 13 3 11.2 3 8V4Z"/><path d="M5.9 8 7.4 9.5 10.3 6.4"/>
      </symbol>
      <symbol id="i-clock" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="8" cy="8" r="5.3"/><path d="M8 5v3l2 1.4"/>
      </symbol>
      <symbol id="i-search" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="7" cy="7" r="3.8"/><line x1="9.8" y1="9.8" x2="13" y2="13"/>
      </symbol>
      <symbol id="i-pin" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 2.6h4l-.7 3 2.1 2.6H4.6L6.7 5.6Z"/><line x1="8" y1="8.2" x2="8" y2="13.4"/>
      </symbol>
      <symbol id="i-refresh" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12.4 6.6A4.7 4.7 0 1 0 13 9.4"/><polyline points="9.2 6.6 12.6 6.6 12.6 3.2"/>
      </symbol>
      <symbol id="i-chev" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="6 4 10 8 6 12"/>
      </symbol>
      <symbol id="i-diamond" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 2.5 13.5 8 8 13.5 2.5 8Z"/>
      </symbol>
      <symbol id="i-disk" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2.5" y="3" width="11" height="10" rx="2"/><circle cx="8" cy="8" r="2.4"/><circle cx="8" cy="8" r="0.3"/>
      </symbol>
      <symbol id="i-alert" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 2.7 14 13H2Z"/><line x1="8" y1="6.4" x2="8" y2="9.4"/><circle cx="8" cy="11.2" r="0.35"/>
      </symbol>
      <symbol id="i-check" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="3.6 8.4 6.5 11.4 12.4 4.9"/>
      </symbol>
      <symbol id="i-copy" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="5.6" y="5.6" width="7" height="7" rx="1.6"/><path d="M3.4 10.4V3.9a.9.9 0 0 1 .9-.9h6.1"/>
      </symbol>
      <symbol id="i-expand" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9.4 3 13 3 13 6.6"/><polyline points="6.6 13 3 13 3 9.4"/><line x1="13" y1="3" x2="9.2" y2="6.8"/><line x1="3" y1="13" x2="6.8" y2="9.2"/>
      </symbol>
      <symbol id="i-stop" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5.7 2.8h4.6l3.1 3.1v4.6l-3.1 3.1H5.7L2.6 10.5V5.9Z"/>
      </symbol>
      <symbol id="i-grid" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2.6" y="2.6" width="4.2" height="4.2" rx="1"/><rect x="9.2" y="2.6" width="4.2" height="4.2" rx="1"/>
        <rect x="2.6" y="9.2" width="4.2" height="4.2" rx="1"/><rect x="9.2" y="9.2" width="4.2" height="4.2" rx="1"/>
      </symbol>
      <symbol id="i-cpu" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="4" width="8" height="8" rx="1.6"/><rect x="6.2" y="6.2" width="3.6" height="3.6" rx="0.6"/>
        <line x1="6.2" y1="2.6" x2="6.2" y2="4"/><line x1="9.8" y1="2.6" x2="9.8" y2="4"/><line x1="6.2" y1="12" x2="6.2" y2="13.4"/><line x1="9.8" y1="12" x2="9.8" y2="13.4"/>
        <line x1="2.6" y1="6.2" x2="4" y2="6.2"/><line x1="2.6" y1="9.8" x2="4" y2="9.8"/><line x1="12" y1="6.2" x2="13.4" y2="6.2"/><line x1="12" y1="9.8" x2="13.4" y2="9.8"/>
      </symbol>
      <symbol id="i-list" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="4.5" x2="13" y2="4.5"/><line x1="3" y1="8" x2="13" y2="8"/><line x1="3" y1="11.5" x2="13" y2="11.5"/>
      </symbol>
      <symbol id="i-graph" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="4" cy="4.2" r="1.6"/><circle cx="12" cy="6" r="1.6"/><circle cx="6" cy="12" r="1.6"/>
        <line x1="5.4" y1="4.7" x2="10.5" y2="5.6"/><line x1="4.5" y1="5.6" x2="5.6" y2="10.5"/>
      </symbol>
      <symbol id="i-terminal" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2.4" y="3" width="11.2" height="10" rx="2"/><polyline points="5 7 7 9 5 11"/><line x1="8.6" y1="11" x2="11" y2="11"/>
      </symbol>
      <symbol id="i-arrowdown" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <line x1="8" y1="3" x2="8" y2="11.6"/><polyline points="4.6 8.4 8 11.8 11.4 8.4"/>
      </symbol>
      <symbol id="i-cols" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2.6" y="3" width="10.8" height="10" rx="1.8"/><line x1="8" y1="3.2" x2="8" y2="12.8"/>
      </symbol>
      <symbol id="i-bolt" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 2.3 4.4 9.1H7.3L6.9 13.7 11.6 6.7H8.7Z"/>
      </symbol>
    </defs>
  </svg>

  <main id="app">
    <!-- STAGE HEADER (0.18.0) — static surface navigation over the work surface;
         identity stays in the full-height rail and the conn dot + updated-age in
         the status dock. Keeping these tabs in markup makes every section
         reachable even before (or without) a thread-registry response.
         Left→right: surface tabs · spacer · health/stop · refresh. -->
    <header id="top-bar">
      <nav id="surface-tabs" role="tablist" aria-label="Sections">
        <button type="button" class="tab" data-surface="home" aria-pressed="false" title="Home">
          <svg class="icon" aria-hidden="true"><use href="#i-grid"/></svg><span class="surface-tab-label">Home</span>
        </button>
        <button type="button" class="tab" data-surface="plan" aria-pressed="false" title="Plan">
          <svg class="icon" aria-hidden="true"><use href="#i-graph"/></svg><span class="surface-tab-label">Plan</span>
        </button>
        <button type="button" class="tab" data-surface="consoles" aria-pressed="false" title="Consoles">
          <svg class="icon" aria-hidden="true"><use href="#i-terminal"/></svg><span class="surface-tab-label">Consoles</span>
        </button>
        <button type="button" class="tab" data-surface="agents" aria-pressed="false" title="Agents">
          <svg class="icon" aria-hidden="true"><use href="#i-hub"/></svg><span class="surface-tab-label">Agents</span>
        </button>
      </nav>
      <span class="top-spacer"></span>
      <span id="health-flag" class="health-flag" data-tone="idle"><span class="tone-dot"></span><span id="health-text">loading</span></span>
      <span id="stop-chip" class="status-chip" data-tone="idle" data-present="false"><svg class="icon" style="width:13px;height:13px"><use href="#i-stop"/></svg><span id="stop-text">stop —</span><span id="stop-reason" hidden></span></span>
      <button id="btn-refresh" class="primary-button compact" title="Reload snapshot"><svg class="icon"><use href="#i-refresh"/></svg>Refresh</button>
    </header>

    <!-- DATA-HEALTH BANNER (0.23.5) — shown by core/health.js while any read is
         failing; persistent until the next success. Shares the top grid row. -->
    <div id="conn-banner" role="alert" hidden>
      <span class="cb-dot" aria-hidden="true"></span>
      <span class="cb-title"></span>
      <span class="cb-detail"></span>
      <span class="cb-retry mono"></span>
      <button class="secondary-button compact" type="button" data-api-retry>Retry now</button>
    </div>

    <!-- HISTORICAL BANNER — shown only when pinned to an archived plan (?plan=). -->
    <div id="plan-banner" hidden>
      <span class="pb-dot" aria-hidden="true"></span>
      <span class="pb-text">Viewing archived plan — read-only</span>
      <button id="pb-back" class="secondary-button compact pb-back" type="button">Back to live</button>
    </div>

    <!-- APP-LEVEL LEFT SIDEBAR (0.10.0) — plan threads (live + archived) up top,
         app-level nav pinned to the bottom. First step toward a two-level shell;
         future app-level slots (Projects, per-project MCPs, Settings) will sit
         beside Providers in #side-nav. Rows are painted by core/plans.js
         (threads) and are static markup (nav). Collapses to an icon rail. -->
    <aside id="side-bar">
      <div class="side-brand">
        <span class="brand-copy">
          <strong>singular</strong>
          <small id="brand-repo">—</small>
        </span>
        <button id="side-collapse" class="icon-btn" type="button" aria-expanded="true" title="Collapse sidebar" aria-label="Collapse sidebar">
          <svg class="icon"><use href="#i-chev"/></svg>
        </button>
      </div>
      <div id="side-threads">
        <div class="side-eyebrow">threads</div>
        <div id="side-threads-list"></div>
      </div>
      <nav id="side-nav" aria-label="App navigation">
        <div class="side-eyebrow">app</div>
        <button type="button" data-surface="providers" aria-pressed="false" title="Providers">
          <svg class="icon"><use href="#i-cpu"/></svg><span class="sn-label">Providers</span>
        </button>
        <!-- future app-level slots: Projects · per-project MCPs · Settings -->
      </nav>
    </aside>

    <!-- MAIN VIEWPORT — three surface roots; the router shows exactly one. -->
    <section id="surface-plan" class="surface" data-active="false" hidden>
      <div id="plan-workbench-header">
        <nav id="plan-lens-tabs" role="tablist" aria-orientation="horizontal" aria-label="Plan views"></nav>
        <label class="search-wrap"><svg class="icon"><use href="#i-search"/></svg>
          <input id="search-input" type="search" placeholder="search id · title · branch" autocomplete="off" spellcheck="false">
        </label>
        <span class="select-wrap">
          <select id="filter-area" class="filter" aria-label="Filter by area"><option value="">all areas</option></select>
          <span class="chev"><svg class="icon" style="width:13px;height:13px"><use href="#i-chev"/></svg></span>
        </span>
        <span class="select-wrap">
          <select id="filter-status" class="filter" aria-label="Filter by status">
            <option value="">all states</option>
            <option value="active">active</option>
            <option value="awaiting">awaiting release</option>
            <option value="blocked">blocked</option>
            <option value="failed">failed</option>
            <option value="stale">stale</option>
            <option value="integrated">integrated</option>
            <option value="idle">idle</option>
          </select>
          <span class="chev"><svg class="icon" style="width:13px;height:13px"><use href="#i-chev"/></svg></span>
        </span>
        <div class="plan-quickfilters" id="plan-quickfilters" role="group" aria-label="Quick status filters">
          <button type="button" class="qf-pill" data-qf="active" aria-pressed="false"><span class="tone-dot" data-tone="active"></span>active<span class="qf-count" id="qf-active">—</span></button>
          <button type="button" class="qf-pill" data-qf="awaiting" aria-pressed="false"><span class="tone-dot" data-tone="awaiting"></span>await<span class="qf-count" id="qf-awaiting">—</span></button>
          <button type="button" class="qf-pill" data-qf="blocked" aria-pressed="false"><span class="tone-dot" data-tone="error"></span>blocked<span class="qf-count" id="qf-blocked">—</span></button>
        </div>
        <button type="button" class="plan-gates-readout" id="plan-gates-readout" title="Plan overview — progress, inputs, settings, status">gates <b id="plan-gates-val">—</b></button>
        <span id="showing-count"></span>
      </div>
      <div id="plan-body">
        <div id="plan-pane" aria-label="Plan lens"></div>
      </div>
    </section>
    <section id="surface-consoles" class="surface" data-active="false" hidden>
      <span class="surface-stub">Consoles — coming in this release</span>
    </section>
    <section id="surface-agents" class="surface" data-active="false" hidden>
      <span class="surface-stub">Agents — coming in this release</span>
    </section>
    <section id="surface-providers" class="surface" data-active="false" hidden>
      <span class="surface-stub">Providers — coming in this release</span>
    </section>
    <section id="surface-home" class="surface" data-active="false" hidden>
      <div class="home-body" id="home-body"></div>
    </section>

    <!-- SHARED DETAIL DOCK — Plan selections use this full-stage-width row on
         wide screens. The same inspector becomes a modal bottom drawer on narrow
         screens and outside Plan, so every lens shares one detail implementation. -->
    <div id="inspector-scrim" data-open="false"></div>
    <aside id="inspector" class="glass" data-subject-kind="none" data-presentation="modal" data-collapsed="false" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Selected item details">
      <button id="inspector-grip" type="button" role="separator" tabindex="-1" aria-orientation="horizontal" aria-label="Resize details panel" title="Drag or use arrow keys to resize"></button>
      <div id="inspector-title" tabindex="-1">
        <span class="bezel" id="insp-bezel" data-tone="idle"><svg class="icon"><use href="#i-box"/></svg></span>
        <div class="insp-head-main">
          <div class="insp-head-top">
            <span class="insp-id mono" id="insp-id"></span>
            <span class="insp-title" id="insp-title">select an item to inspect</span>
          </div>
          <div class="insp-sub" id="insp-sub"></div>
        </div>
        <div class="insp-head-actions">
          <span class="insp-raw-cluster" id="insp-raw-cluster"></span>
          <span class="status-chip" id="insp-chip" data-tone="idle" hidden><span class="tone-dot"></span><span></span></span>
          <button class="icon-btn" id="insp-console" title="Open console" aria-label="Open this run in the Consoles surface" hidden><svg class="icon"><use href="#i-terminal"/></svg></button>
          <button class="icon-btn" id="insp-pin" aria-pressed="false" title="Pin task" aria-label="Pin task" hidden><svg class="icon"><use href="#i-pin"/></svg></button>
          <button class="icon-btn" id="insp-collapse" type="button" aria-expanded="true" title="Collapse details" aria-label="Collapse details"><svg class="icon"><use href="#i-chev"/></svg></button>
          <button class="icon-btn" id="insp-close" type="button" title="Close details (Esc)" aria-label="Close details"><svg class="icon"><use href="#i-stop"/></svg></button>
        </div>
      </div>
      <div id="inspector-tabs" role="tablist"></div>
      <div id="inspector-body">
        <div class="insp-state" id="inspector-skeleton">
          <div class="skeleton-bar" style="width:40%"></div>
          <div class="skeleton-bar" style="width:80%"></div>
          <div class="skeleton-bar" style="width:60%"></div>
        </div>
        <div class="insp-state" id="inspector-error">
          <svg class="icon"><use href="#i-alert"/></svg>
          <div class="hint" id="inspector-error-text">could not load task detail</div>
        </div>
        <div id="inspector-panels"></div>
      </div>
    </aside>

    <!-- PERSISTENT STATUS DOCK (0.11.0) — the ambient system-state layer, painted
         each snapshot tick by core/dock.js from the app.js store (S.snap + the
         already-polled S.overview). Cells navigate via hash (no data-surface, so the
         shell test's tab count is unaffected). Right cluster holds repo·branch and
         the relocated conn dot + updated-age (#conn-dot / #refresh-age keep the ids
         app.js writes to). -->
    <footer id="status-dock" aria-label="System status">
      <div class="dock-live" id="dock-live">
        <button class="dock-cell" id="dock-loop" type="button" data-dock-nav="#home" title="Autonomous loop">
          <span class="state-dot" id="dock-loop-dot"></span><span id="dock-loop-text">loop —</span>
        </button>
        <button class="dock-cell" id="dock-tasks" type="button" data-dock-nav="#plan/tasks" title="Open tasks">
          <span id="dock-tasks-text">— active · — ready</span>
        </button>
        <!-- frontier — ready-by-dependency vs runnable-now vs the
             concurrency cap, with the per-node serialization reasons in the
             title. Hidden until /api/overview reports l1Selection. -->
        <button class="dock-cell" id="dock-frontier" type="button" data-dock-nav="#plan/dag" title="L1 frontier selection" hidden>
          <span id="dock-frontier-text"></span>
        </button>
        <button class="dock-cell" id="dock-gates" type="button" data-dock-nav="#plan/timeline" title="Gate progress">
          <span id="dock-gates-text">gates —/—</span>
        </button>
        <button class="dock-cell" id="dock-attention" type="button" data-dock-nav="#home" title="Items that need you">
          <span class="state-dot" id="dock-attention-dot"></span><span id="dock-attention-text">—</span>
        </button>
        <button class="dock-cell" id="dock-breaker" type="button" data-dock-nav="#home" title="Circuit breaker" hidden>
          <span id="dock-breaker-text"></span>
        </button>
        <!-- codex subscription quota (0.11.0) — painted by core/dock.js from its own
             /api/providers probe (codex is the only provider exposing headless usage).
             Hidden until a usable percent exists; never fabricated. -->
        <button class="dock-cell" id="dock-quota" type="button" data-dock-nav="#providers" title="Codex subscription usage" hidden>
          <span class="state-dot" id="dock-quota-dot"></span><span id="dock-quota-text"></span>
        </button>
      </div>
      <div class="dock-hist" id="dock-hist" hidden>
        <span class="dock-cell dock-hist-msg" id="dock-hist-text">viewing archived plan</span>
        <button class="dock-cell dock-back" id="dock-hist-back" type="button">back to live</button>
      </div>
      <span class="status-spacer"></span>
      <span class="dock-cell dock-repo"><span id="dock-repo-text">—</span></span>
      <span class="dock-cell dock-conn"><span id="conn-dot" data-state="down"></span><span class="dock-conn-lbl">updated</span><span id="refresh-age" class="mono">—</span></span>
    </footer>
  </main>

  <div id="toast"></div>
  <div id="sr-status" role="status" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap"></div>
  <script type="module" src="/assets/main.js"></script>
</body>
</html>
